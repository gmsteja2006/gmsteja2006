<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#0c4a6e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes flow { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .w1 { animation: flow 14s linear infinite; }
    .w2 { animation: flow 9s linear infinite; }
    .t1 { animation: fade 1.2s ease-out both; }
    .t2 { animation: fade 1.2s ease-out 0.5s both; }
  </style>
  <rect width="1000" height="240" fill="url(#bg)"/>
  <text class="t1" x="500" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Teja Gowthu</text>
  <text class="t2" x="500" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#bae6fd">AI / ML Engineer  |  Backend &amp; RAG Systems</text>
  <g class="w1"><path fill="#38bdf8" fill-opacity="0.25" d="M0 205 q125 -30 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V240 H0 Z"/></g>
  <g class="w2"><path fill="#2dd4bf" fill-opacity="0.35" d="M0 220 q125 -24 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V240 H0 Z"/></g>
</svg>
