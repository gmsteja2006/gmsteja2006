<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b2540"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0369a1" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#115e59" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes flow { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
    @keyframes bob  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
    @keyframes glint { 0%,100% { opacity: 0.1; } 50% { opacity: 0.9; } }
    .w1 { animation: flow 18s linear infinite; }
    .w2 { animation: flow 12s linear infinite; }
    .w3 { animation: flow 7s linear infinite; }
    .b  { animation: bob 4s ease-in-out infinite; }
    .s  { animation: glint 3s ease-in-out infinite; }
    .s2 { animation-delay: 1s; }
    .s3 { animation-delay: 2s; }
  </style>

  <rect width="1000" height="200" fill="url(#sky)"/>

  <!-- stars / glints -->
  <circle class="s" cx="120" cy="30" r="1.6" fill="#e0f2fe"/>
  <circle class="s s2" cx="420" cy="18" r="1.2" fill="#e0f2fe"/>
  <circle class="s s3" cx="700" cy="40" r="1.5" fill="#e0f2fe"/>
  <circle class="s s2" cx="900" cy="22" r="1.3" fill="#e0f2fe"/>

  <!-- back wave -->
  <g class="b">
    <g class="w1">
      <path fill="url(#r1)" d="M0 80 q125 -40 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V200 H0 Z"/>
    </g>
  </g>
  <!-- middle wave -->
  <g class="b" style="animation-delay:-1.5s">
    <g class="w2">
      <path fill="url(#r2)" d="M0 110 q125 -34 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V200 H0 Z"/>
    </g>
  </g>
  <!-- front wave -->
  <g class="b" style="animation-delay:-3s">
    <g class="w3">
      <path fill="url(#r3)" d="M0 140 q125 -28 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V200 H0 Z"/>
    </g>
  </g>
</svg>
